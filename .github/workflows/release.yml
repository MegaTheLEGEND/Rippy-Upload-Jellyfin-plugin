name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.2 or 1.0.2.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PROJECT: Jellyfin.Plugin.RippyUpload
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate and normalize version
        id: ver
        run: |
          v="${{ inputs.version }}"
          v="${v#v}"
          if ! [[ "$v" =~ ^[0-9]+(\.[0-9]+){2,3}$ ]]; then
            echo "::error::Version must look like 1.2.3 or 1.2.3.4 (got '$v')"
            exit 1
          fi
          # Jellyfin needs a 4-part version
          IFS='.' read -ra parts <<< "$v"
          while [ ${#parts[@]} -lt 4 ]; do parts+=("0"); done
          full="${parts[0]}.${parts[1]}.${parts[2]}.${parts[3]}"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "tag=v$full" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$full" >/dev/null 2>&1; then
            echo "::error::Tag v$full already exists"
            exit 1
          fi

      - name: Set version in csproj and meta.json
        run: |
          full="${{ steps.ver.outputs.full }}"
          csproj="$PROJECT/$PROJECT.csproj"
          sed -i -E "s|<AssemblyVersion>[^<]*</AssemblyVersion>|<AssemblyVersion>$full</AssemblyVersion>|" "$csproj"
          sed -i -E "s|<FileVersion>[^<]*</FileVersion>|<FileVersion>$full</FileVersion>|" "$csproj"
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq --arg v "$full" --arg t "$now" '.version = $v | .timestamp = $t' meta.json > meta.tmp
          mv meta.tmp meta.json
          cat meta.json
          grep -E "AssemblyVersion|FileVersion" "$csproj"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet publish "$PROJECT" -c Release -o out

      - name: Package
        id: pkg
        run: |
          full="${{ steps.ver.outputs.full }}"
          zip_name="rippy-upload_${full}.zip"
          mkdir -p stage
          cp out/Jellyfin.Plugin.RippyUpload.dll stage/
          cp meta.json stage/
          (cd stage && zip -9 -r "../$zip_name" .)
          md5=$(md5sum "$zip_name" | cut -d' ' -f1)
          sha256=$(sha256sum "$zip_name" | cut -d' ' -f1)
          echo "$md5  $zip_name" > "$zip_name.md5"
          echo "$sha256  $zip_name" > "$zip_name.sha256"
          echo "zip=$zip_name" >> "$GITHUB_OUTPUT"
          echo "md5=$md5" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Commit version bump and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta.json "$PROJECT/$PROJECT.csproj"
          git commit -m "Release ${{ steps.ver.outputs.tag }}" || echo "No version changes to commit"
          git tag "${{ steps.ver.outputs.tag }}"
          git push origin HEAD --follow-tags

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then flags="--prerelease"; fi
          gh release create "${{ steps.ver.outputs.tag }}" \
            "${{ steps.pkg.outputs.zip }}" \
            "${{ steps.pkg.outputs.zip }}.md5" \
            "${{ steps.pkg.outputs.zip }}.sha256" \
            --title "Rippy Upload ${{ steps.ver.outputs.tag }}" \
            --generate-notes \
            $flags

      - name: Summary
        run: |
          {
            echo "### Released ${{ steps.ver.outputs.tag }}"
            echo ""
            echo "- Asset: \`${{ steps.pkg.outputs.zip }}\`"
            echo "- MD5 (for Jellyfin manifest): \`${{ steps.pkg.outputs.md5 }}\`"
            echo "- SHA256: \`${{ steps.pkg.outputs.sha256 }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
